<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Mój Komunikator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #chat-box { height: 300px; border: 1px solid #ddd; border-radius: 4px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .msg { margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .msg span { font-weight: bold; color: #007bff; }
        input, button { padding: 10px; margin-right: 5px; border: 1px solid #ccc; border-radius: 4px; }
        input { width: 65%; }
        button { width: 25%; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Mój Prosty Czat</h2>
    <input type="text" id="username" placeholder="Twoje imię..." style="width: 90%; margin-bottom: 10px;">
    <div id="chat-box"></div>
    <div style="display: flex;">
        <input type="text" id="message" placeholder="Napisz wiadomość...">
        <button id="send-btn">Wyślij</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrB9ror4PxtE57WiR2s3vb_PUS0V-G2Os",
      authDomain: "komunikator-731ac.firebaseapp.com",
      databaseURL: "https://komunikator-731ac-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "komunikator-731ac",
      storageBucket: "komunikator-731ac.firebasestorage.app",
      messagingSenderId: "814929600334",
      appId: "1:814929600334:web:c030a098ec27ff91c0c81f",
      measurementId: "G-HMHQ6V03KE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const chatBox = document.getElementById("chat-box");
    const sendBtn = document.getElementById("send-btn");

    function sendMessage() {
        const user = document.getElementById("username").value || "Anonim";
        const text = document.getElementById("message").value;
        
        if (text.trim() === "") return;

        push(ref(db, 'messages/'), {
            user: user,
            text: text
        });

        document.getElementById("message").value = "";
    }

    sendBtn.addEventListener("click", sendMessage);

    document.getElementById("message").addEventListener("keypress", function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    onValue(ref(db, 'messages/'), (snapshot) => {
        chatBox.innerHTML = "";
        const data = snapshot.val();
        if (data) {
            Object.values(data).forEach(msg => {
                const msgDiv = document.createElement("div");
                msgDiv.className = "msg";
                msgDiv.innerHTML = `<span>${msg.user}:</span> ${msg.text}`;
                chatBox.appendChild(msgDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    });
</script>

</body>
</html>
